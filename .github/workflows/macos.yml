name: macOS build
on: [push, pull_request]
jobs:
  test-and-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build app
        run: bash scripts/build-app.sh
      - name: Archive app preserving executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/Miras.app dist/Miras-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Miras-macOS
          path: dist/Miras-macOS.zip
